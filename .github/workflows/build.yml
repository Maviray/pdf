# Builds and tests every pull request into develop or main, including pull requests from forks.
# It publishes nothing and reads the repository only, so a contributor's change can't reach secrets or packages.
# Publishing lives in publish-nuget.yml.
name: Build

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

# A new push to the pull request cancels the run that is still checking the previous one.
concurrency:
  group: build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the .NET SDK from global.json
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c "$CONFIGURATION"

      # The tests check every generated PDF, and every font the parser reads, with tools we didn't write (spec D-11, F-13).
      - name: Install the PDF and font validators
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qpdf poppler-utils python3-fonttools
          qpdf --version
          pdftoppm -v
          python3 -c "import fontTools; print('fontTools', fontTools.version)"

      - name: Test
        env:
          # A missing validator fails the run instead of skipping its checks.
          MAVIRAY_PDF_REQUIRE_VALIDATORS: true
        run: dotnet test --no-build -c "$CONFIGURATION"

      # The text engine must not depend on ICU (spec T-01), so its tests run a second time with globalization
      # invariant. A namespace filter matches exactly, so the text namespace and its sub-namespaces are both named.
      - name: Test the text engine without ICU
        env:
          DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: true
          MAVIRAY_PDF_REQUIRE_VALIDATORS: true
        run: >-
          dotnet test --no-build -c "$CONFIGURATION"
          --filter-namespace "Maviray.Pdf.Tests.Text"
          --filter-namespace "Maviray.Pdf.Tests.Text.*"

      # The PDFs and renders the tests wrote, for checking by hand in Acrobat, Chrome and Firefox (spec D-13).
      - name: Upload the generated PDFs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-pdfs
          path: tests/**/bin/**/generated/
          if-no-files-found: warn
          retention-days: 14
